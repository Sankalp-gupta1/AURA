services:
  - type: web
    name: aura-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: aura-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_URL
        fromService:
          name: aura-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTO_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: MAX_EMAILS_PER_SYNC
        value: "40"

  - type: web
    name: aura-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: aura-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: aura-db
    plan: free
    region: singapore
    databaseName: aura
    user: aura
