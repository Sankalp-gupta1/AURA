services:
  - type: web
    name: aura-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://aura-frontend-gmuw.onrender.com
      - key: BACKEND_URL
        value: https://aura-backend-0l5h.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://aura-backend-0l5h.onrender.com/api/auth/google/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTO_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: MAX_EMAILS_PER_SYNC
        value: "40"

  - type: web
    name: aura-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.17.0
      - key: NEXT_PUBLIC_API_URL
        value: https://aura-backend-0l5h.onrender.com

databases:
  - name: aura-db
    plan: free
    region: singapore
    databaseName: aura
    user: aura
